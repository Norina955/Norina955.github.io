<body>

    <div class="countdown-container">
        <h2>A SULI VÉGÉIG HÁTRALÉVŐ IDŐ:</h2>

        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <p>Nap</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>Óra</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>Perc</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>Másodperc</p>
            </div>
        </div>

        <p id="expired-message" class="hidden"></p>
        <div style="text-align: center;">
            <a href="index.html" class="back-btn">← Vissza a főoldalra</a>
        </div>
    </div>
